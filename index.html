<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CAT TV" />
  <meta name="theme-color" content="#131619" />
  <meta name="description" content="Fullscreen aquarium, birds, laser dots and other motion scenes to entertain cats on a TV, tablet, or phone." />
  <title>CAT TV — Entertainment for cats</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="stage" tabindex="-1" aria-label="Scene player"></canvas>

  <main id="start-screen" class="guide" hidden>
    <div class="guide-wrap">
      <header class="guide-head">
        <span class="brand"><img src="favicon.svg" width="40" height="40" alt="" />Cat TV</span>
        <button type="button" id="guide-sound" class="sound-chip">Sound on</button>
      </header>
      <section class="feature" aria-labelledby="featured-name">
        <canvas id="featured-art" width="1400" height="640" aria-hidden="true"></canvas>
        <div class="feature-copy">
          <p class="kicker">First in your playlist</p>
          <h1 id="featured-name">Aquarium</h1>
          <p id="featured-blurb"></p>
          <button type="button" id="start-btn" class="start-btn"><span class="play-mark" aria-hidden="true"></span>Play playlist</button>
        </div>
      </section>
      <section class="catalogue" aria-labelledby="guide-title">
        <header class="catalogue-head"><h2 id="guide-title">Scene guide</h2><span id="scene-count"></span></header>
        <div id="guide-scenes" class="guide-grid"></div>
      </section>
    </div>
  </main>

  <button type="button" id="reveal-controls" aria-controls="chrome" hidden>Controls</button>
  <button type="button" id="enable-audio" class="audio-prompt" hidden>Enable sound <span>Press OK or tap</span></button>
  <div id="scene-toast" class="scene-toast" hidden></div>

  <div id="chrome" class="chrome is-hidden" inert>
    <header class="topbar" role="toolbar" aria-label="Playback controls">
      <div class="topbar-inner">
        <div class="cluster">
          <button type="button" id="btn-guide" class="icon-btn" aria-label="Scene guide" data-tip="Scene guide">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button type="button" id="btn-prev" class="icon-btn" aria-label="Previous scene" data-tip="Previous">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M16.7 5.3a1 1 0 0 1 0 1.4L11.4 12l5.3 5.3a1 1 0 1 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"/>
              <path fill="currentColor" d="M7 5.25a.75.75 0 0 1 .75.75v12a.75.75 0 0 1-1.5 0V6A.75.75 0 0 1 7 5.25z"/>
            </svg>
          </button>
          <button type="button" id="btn-next" class="icon-btn" aria-label="Next scene" data-tip="Next">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M7.3 5.3a1 1 0 0 1 1.4 0l6 6a1 1 0 0 1 0 1.4l-6 6a1 1 0 1 1-1.4-1.4L12.6 12 7.3 6.7a1 1 0 0 1 0-1.4z"/>
              <path fill="currentColor" d="M17 5.25a.75.75 0 0 1 .75.75v12a.75.75 0 0 1-1.5 0V6A.75.75 0 0 1 17 5.25z"/>
            </svg>
          </button>
        </div>

        <div class="now">
          <div class="now-text">
            <span class="now-kicker">Now playing</span>
            <strong id="now-playing">CAT TV</strong>
          </div>
          <div class="progress-wrap" title="Time in this scene">
            <div id="progress" class="progress"></div>
          </div>
        </div>

        <div class="cluster">
          <button type="button" id="btn-mute" class="icon-btn" aria-label="Mute sound" data-tip="Mute" aria-pressed="false">
            <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M4.5 9.5h3.2L12 6.2a.8.8 0 0 1 1.3.6v10.4a.8.8 0 0 1-1.3.6L7.7 14.5H4.5A1.5 1.5 0 0 1 3 13v-2a1.5 1.5 0 0 1 1.5-1.5z"/>
              <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16.2 9.2a4 4 0 0 1 0 5.6M18.5 7a7 7 0 0 1 0 10"/>
            </svg>
            <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M4.5 9.5h3.2L12 6.2a.8.8 0 0 1 1.3.6v10.4a.8.8 0 0 1-1.3.6L7.7 14.5H4.5A1.5 1.5 0 0 1 3 13v-2a1.5 1.5 0 0 1 1.5-1.5z"/>
              <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16.2 9.8 20 16.2M20 9.8l-3.8 6.4"/>
            </svg>
          </button>
          <button type="button" id="btn-fullscreen" class="icon-btn" aria-label="Enter fullscreen" data-tip="Fullscreen" aria-pressed="false">
            <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 5H5v3M16 5h3v3M8 19H5v-3M16 19h3v-3"/>
            </svg>
            <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 8H6v3M15 8h3v3M9 16H6v-3M15 16h3v-3"/>
            </svg>
          </button>
          <button type="button" id="btn-settings" class="icon-btn" aria-label="Open settings" data-tip="Settings" aria-expanded="false" aria-controls="settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M11.1 3.5h1.8l.3 2.1a6.7 6.7 0 0 1 1.7.7l1.9-1 1.3 1.3-1 1.9c.3.5.5 1.1.7 1.7l2.1.3v1.8l-2.1.3a6.7 6.7 0 0 1-.7 1.7l1 1.9-1.3 1.3-1.9-1a6.7 6.7 0 0 1-1.7.7l-.3 2.1h-1.8l-.3-2.1a6.7 6.7 0 0 1-1.7-.7l-1.9 1-1.3-1.3 1-1.9a6.7 6.7 0 0 1-.7-1.7l-2.1-.3v-1.8l2.1-.3c.2-.6.4-1.2.7-1.7l-1-1.9 1.3-1.3 1.9 1c.5-.3 1.1-.5 1.7-.7l.3-2.1zM12 9.2A2.8 2.8 0 1 0 12 14.8 2.8 2.8 0 0 0 12 9.2z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <aside id="settings" class="settings is-hidden" inert role="dialog" aria-labelledby="settings-title" aria-hidden="true">
      <div class="settings-inner">
        <header class="settings-head">
          <h2 id="settings-title">Settings</h2>
          <button type="button" id="btn-close-settings" class="icon-btn" aria-label="Close settings" data-tip="Close">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
            </svg>
          </button>
        </header>

        <section class="settings-block">
          <div class="section-heading"><h3>Playlist</h3><span id="playlist-count"></span></div>
          <div id="scene-toggles" class="scene-grid"></div>
        </section>

        <section class="settings-block">
          <label class="length-row">Scene length<select id="duration-presets"></select></label>
          <label class="custom-duration" id="custom-duration-wrap" hidden>
            Custom
            <input id="custom-duration" type="number" min="5" max="7200" step="1" inputmode="numeric" />
            <span>seconds</span>
          </label>
        </section>

        <section class="playback-row">
          <label class="switch">
            <input id="shuffle" type="checkbox" />
            <span class="switch-ui" aria-hidden="true"></span>
            <span>Shuffle</span>
          </label>
          <label class="switch">
            <input id="sound" type="checkbox" checked />
            <span class="switch-ui" aria-hidden="true"></span>
            <span>Sound</span>
          </label>
          <label class="volume">
            <span>Volume</span>
            <input id="volume" type="range" min="0" max="100" value="55" />
          </label>
        </section>
      </div>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
